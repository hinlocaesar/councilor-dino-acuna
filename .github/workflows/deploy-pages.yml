# Publishes the exported site to GitHub Pages.
#
# What is published is dist/ — the markup rendered by the Umbraco CMS and
# committed to this repository — plus the assets copied in from cms/wwwroot.
#
# Why the markup is committed rather than rendered here
# ----------------------------------------------------
# It is tempting to spin up .NET in this workflow and render the pages at deploy
# time. That would be wrong. The content lives in a local SQLite database, not in
# the repository, so a fresh CI render would seed itself from
# cms/Seeding/wordpress-posts.json and publish content that predates every edit
# made in the local backoffice. The edits would silently never reach the site.
#
# So: edit in the backoffice, run `npm run pages:build`, commit dist/, push.
# That keeps the CMS authoritative, which is the point of having one.
#
# SETUP (once): Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# Then the site is at https://hinlocaesar.github.io/councilor-dino-acuna/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # dist/ holds the markup. Check it matches the import before publishing,
      # so a forgotten `npm run pages:build` fails loudly instead of quietly
      # serving a stale site.
      - name: Check the export covers every imported post
        run: node tools/check-export.mjs

      # The images are committed already minified by tools/optimize-images.mjs.
      # Re-running it would be a no-op; verifying proves the committed binaries
      # are the optimised ones rather than raw WordPress downloads.
      - name: Verify the committed images are minified and intact
        run: |
          node tools/verify-images.mjs
          node tools/report-payload.mjs

      - name: Copy the assets in from cms/wwwroot
        run: node tools/assemble-pages.mjs

      # Pages serves a project repository from a subpath, so every asset
      # reference has to be document-relative or it 404s while working perfectly
      # on localhost. Serve dist/ under that prefix and load it in a real
      # browser before publishing.
      - name: Check the site works from a subpath
        run: |
          npx playwright install --with-deps chromium
          node tools/verify-export.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
